name: testing-other-ways

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  list-folder1-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files in folder1
        run: find stuff/folder1 -maxdepth 1 -type f -printf '%f\n'

  list-folder2-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files in folder2
        run: find stuff/folder2 -maxdepth 1 -type f -printf '%f\n'

  list-folder3-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files in folder3
        run: find stuff/folder3 -maxdepth 1 -type f -printf '%f\n'

  final-status:
    needs: [list-folder1-files, list-folder2-files, list-folder3-files]
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"
