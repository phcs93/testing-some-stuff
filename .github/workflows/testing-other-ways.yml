name: testing-other-ways

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  start-listing:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Starting file listing sddsf"

  list-folders-files:
    name: List files in ${{ matrix.folder }}
    needs: start-listing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [folder1, folder2]
    steps:
      - uses: actions/checkout@v4
      - name: List files
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          echo "Files in stuff/$FOLDER:"
          find "stuff/$FOLDER" -maxdepth 1 -type f -printf '%f\n'

  list-folder3-files:
    needs: start-listing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files in folder3
        run: find stuff/folder3 -maxdepth 1 -type f -printf '%f\n'

  final-status:
    needs: [list-folders-files, list-folder3-files]
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"
