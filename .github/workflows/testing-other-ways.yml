name: testing-other-ways

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  start-listing:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Starting file listing sddsf"

  list-folder1-files:
    name: List files in folder1
    needs: start-listing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [folder1]
    steps:
      - uses: actions/checkout
      - name: List files
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          echo "Files in stuff/$FOLDER:"
          find "stuff/$FOLDER" -maxdepth 1 -type f -printf '%f\n'

  list-folder2-files:
    name: List files in folder2
    needs: start-listing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [folder2]
    steps:
      - uses: actions/checkout
      - name: List files
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          echo "Files in stuff/$FOLDER:"
          find "stuff/$FOLDER" -maxdepth 1 -type f -printf '%f\n'

  list-folder3-files:
    name: List files in folder3
    needs: start-listing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [folder3]
    steps:
      - uses: actions/checkout
      - name: List files
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          echo "Files in stuff/$FOLDER:"
          find "stuff/$FOLDER" -maxdepth 1 -type f -printf '%f\n'

  list-folder-again-files:
    needs: start-listing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout
      - name: List files in folder3
        run: find stuff/folder3 -maxdepth 1 -type f -printf '%f\n'

  final-status:
    needs: [list-folder1-files, list-folder2-files, list-folder3-files, ]
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"
